; Настройки PHP для учебного сервера (ПР 2).
; Главное отличие от боевого сервера — все ошибки показываются на экране:
; на учёбе важно видеть каждое предупреждение, а не прятать его.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Методичка разбирает короткий открывающий тег <? — включаем, чтобы
; примеры из неё работали. На реальном проекте его держат выключенным.
short_open_tag = On

date.timezone = Europe/Moscow
default_charset = UTF-8

memory_limit = 256M
max_execution_time = 60
post_max_size = 8M
upload_max_filesize = 8M

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
