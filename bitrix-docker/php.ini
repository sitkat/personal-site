; Настройки PHP под требования 1С-Битрикс.
; Значения взяты из раздела «Настройка PHP» проверки системы Битрикса.

memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 10000

upload_max_filesize = 1024M
post_max_size = 1024M
file_uploads = On

; В PHP 8 mbstring.func_overload должен быть равен 0 — Битрикс это проверяет
mbstring.func_overload = 0
mbstring.internal_encoding = UTF-8
default_charset = UTF-8

date.timezone = Europe/Moscow
default_socket_timeout = 60
short_open_tag = On
precision = 14

; Кеш байт-кода: без него Битрикс сильно медленнее
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 100000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

display_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
